---
- name: "REDHAT - Install kmod package"
  ansible.builtin.dnf:
    name: kmod
    state: present
  register: __pkg_result
  retries: 12
  delay: 10
  until: __pkg_result is success
  when: ansible_facts.os_family in ["RedHat", "Rocky", "OracleLinux"]
  tags: [modules_package]

- name: "Configure modules to load at boot"
  ansible.builtin.template:
    src: modules.conf.j2
    dest: "{{ _modules_load_file }}"
    owner: root
    group: root
    mode: '0644'
  when: modules_load | length > 0
  tags: [modules_load]

- name: "Load modules now"
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ modules_load }}"
  when: modules_load | length > 0
  tags: [modules_load]

- name: "Blacklisting modules"
  ansible.builtin.template:
    src: blacklist.conf.j2
    dest: '{{ _modules_modprobe_dir }}/blacklist.conf'
    owner: root
    group: root
    mode: '0644'
  when: modules_blacklist | length > 0
  notify: "Update initramfs"
  tags: [modules_blacklist]

- name: "Unload blacklisted modules if loaded"
  community.general.modprobe:
    name: "{{ item }}"
    state: absent
  loop: "{{ modules_blacklist }}"
  register: __modules_unload
  failed_when:
    - __modules_unload is failed
    - "'Module unloading is not supported' not in (__modules_unload.msg | default(''))"
    - "'in use' not in (__modules_unload.msg | default(''))"
  when: modules_blacklist | length > 0
  tags: [modules_blacklist]

- name: "Create module options files"
  ansible.builtin.template:
    src: modules_options.conf.j2
    dest: "{{ _modules_modprobe_dir }}/{{ item.key }}.conf"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ modules_options | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: modules_options | length > 0
  notify: "Update initramfs"
  tags: [modules_options]
