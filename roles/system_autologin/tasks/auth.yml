---
- name: "Resolve user via getent (local/LDAP/NSS) - {{ item.name }}"
  ansible.builtin.getent:
    database: passwd
    key: "{{ item.name }}"
    fail_key: false
  register: __autologin_getent
  changed_when: false

- name: "Warn if user not found via getent - {{ item.name }}"
  ansible.builtin.debug:
    msg: "User '{{ item.name }}' not found via getent (local/LDAP/NSS) — skipping autologin setup for this user."
  when: __autologin_getent.ansible_facts.getent_passwd[item.name] is none

- name: "Check for user home - {{ item.name }}"
  ansible.builtin.stat:
    path: '{{ autologin_home_path }}/{{ item.name }}'
  changed_when: false
  register: home
  when: __autologin_getent.ansible_facts.getent_passwd[item.name] is not none

- name: "Create home directory - {{ item.name }}"
  ansible.builtin.file:
    path: "{{ autologin_home_path }}/{{ item.name }}"
    state: directory
    mode: '0750'
    owner: "{{ item.name }}"
    group: "{{ __autologin_getent.ansible_facts.getent_passwd[item.name][2] }}"
  when:
    - __autologin_getent.ansible_facts.getent_passwd[item.name] is not none
    - not home.stat.exists

- name: Copy skeleton into home
  ansible.builtin.copy:
    src: /etc/skel/
    dest: "{{ autologin_home_path }}/{{ item.name }}"
    owner: "{{ item.name }}"
    group: "{{ __autologin_getent.ansible_facts.getent_passwd[item.name][2] }}"
    mode: '0640'
  when:
    - __autologin_getent.ansible_facts.getent_passwd[item.name] is not none
    - not home.stat.exists
  # mode retiré : préserve les permissions d'origine du skel

- name: "Set authorized key on server - {{ item.name }}"
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    state: present
    key: "{{ item.key }}"
  register: __autologin_authkey
  failed_when: false
  when: __autologin_getent.ansible_facts.getent_passwd[item.name] is not none

- name: Warn if authorized_key failed for this user
  ansible.builtin.debug:
    msg: "Failed to set authorized_key for {{ item.name }} — check that the user exists and the key is valid."
  when:
    - __autologin_getent.ansible_facts.getent_passwd[item.name] is not none
    - __autologin_authkey is failed
