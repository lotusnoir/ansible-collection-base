---
galaxy_info:
  author: lotusnoir
  role_name: system_repo_proxy
  description: "Configures a repository proxy for package managers: writes `Acquire::http::Proxy` / `Acquire::https::Proxy` directives on Debian family (`apt`), and `proxy=` lines in `/etc/yum.conf` plus proxy settings in `/etc/rhsm/rhsm.conf` (if present) on RedHat family. Can be fully disabled per-host via `repo_proxy_configure: false`."
  license: "Apache License, Version 2.0"
  min_ansible_version: "2.8"

  platforms:
    - name: "Ubuntu"
      versions:
        - "jammy"
        - "noble"
        - "resolute"
    - name: "Debian"
      versions:
        - "bookworm"
        - "bullseye"
        - "trixie"
    - name: "Rocky"
      versions:
        - "10"
        - "8"
        - "9"
    - name: "OracleLinux"
      versions:
        - "10"
        - "8"
        - "9"
    - name: "RedHat"
      versions:
        - "10"
        - "8"
        - "9"

  galaxy_tags:
    - proxy
    - repo
    - apt
    - yum

dependencies: []
