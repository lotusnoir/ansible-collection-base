---
- name: "DEBIAN | Change Proxy configuration"
  when:
    - repo_proxy_scheme | default('') | length > 0
    - repo_proxy_server | default('') | length > 0
    - repo_proxy_port | default('') | length > 0
  block:
    - name: "DEBIAN | Make sure to remove proxy configuration in main config"
      ansible.builtin.lineinfile:
        path: /etc/apt/apt.conf
        state: absent
        regexp: '^Acquire::http(.*)Proxy'

    - name: "DEBIAN | Remove custom proxy files"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ apt_proxy_remove }}"
      when:
        - apt_proxy_remove is defined
        - apt_proxy_remove | length > 0

    - name: "DEBIAN | Set up new apt-proxy file"
      ansible.builtin.template:
        src: "proxy.j2"
        dest: "{{ apt_proxy_file }}"
        owner: "root"
        group: "root"
        mode: "0644"

    - name: "DEBIAN | Update repositories cache"
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      register: __pkg_result
      retries: 3
      delay: 5
      until: __pkg_result is success
      when:
        - repo_proxy_update_cache is defined
        - repo_proxy_update_cache | bool
