---
- name: Run role
  hosts: all
  become: true
  any_errors_fatal: true
  gather_facts: false

  pre_tasks:
    - name: Get minimal facts
      ansible.builtin.setup:
        gather_subset:
          - '!all'
          - 'distribution'

  tasks:
    - name: Include role
      ansible.builtin.include_role:
        name: ansible-apps_rsyslog
      vars:
        rsyslog_d_custom:
          - name: 10-ignore-systemd-gpg
            content: |
              if ($programname == "systemd") and ($msg contains "Listening on GnuPG" or $msg contains "Closed GnuPG") then stop
          - name: 20-apt
            content: |
              input(type="imfile"
                File="/var/log/apt/history.log"
                Tag="apt"
                Severity="notice"
                Facility="local3"
              )
