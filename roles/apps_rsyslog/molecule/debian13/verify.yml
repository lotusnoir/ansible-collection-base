---
- name: Verify
  hosts: all
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - name: "Verify tasks"
      when: not (ansible_facts.os_family in ['RedHat', 'Rocky', 'OracleLinux'] and ansible_facts.distribution_major_version == '8')
      block:
        - name: Collect packages as facts
          ansible.builtin.package_facts:

        - name: Check package installed
          ansible.builtin.assert:
            that:
              - "'rsyslog' in ansible_facts.packages"

        - name: Collect services as facts
          ansible.builtin.service_facts:

        - name: Check service is running
          ansible.builtin.assert:
            that:
              - "ansible_facts.services['rsyslog.service'].state == 'running'"

        - name: "Check if service is runned by good user"
          ansible.builtin.command: "pgrep -u root -f rsyslog"
          register: process_check
          retries: 10
          delay: 2
          until: process_check.rc == 0
          ignore_errors: true
          changed_when: false

        - name: Validate process running as correct user
          ansible.builtin.assert:
            that: process_check.rc == 0
            fail_msg: "rsyslog is not running as root user"
