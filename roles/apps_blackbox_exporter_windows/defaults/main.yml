---
blackbox_exporter_version: "0.27.0"

blackbox_exporter_install_dir: "C:\\blackbox_exporter"
# blackbox_exporter_user: "LocalSystem"

blackbox_exporter_file: "blackbox_exporter-{{ blackbox_exporter_version }}.windows-amd64.zip"
blackbox_exporter_download_url: >-
  https://github.com/prometheus/blackbox_exporter/releases/download/v{{ blackbox_exporter_version }}/{{ blackbox_exporter_file }}

blackbox_exporter_listen_address: "0.0.0.0:9103"

blackbox_exporter_service_name: "blackbox-exporter"

blackbox_exporter_configuration_modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_status_codes: []
