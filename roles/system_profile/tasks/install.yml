---
- name: "Insert/Update /etc/profile"
  ansible.builtin.blockinfile:
    path: /etc/profile
    block: "{{ profile_main }}"
  when:
    - profile_main is defined
    - profile_main | length > 0

- name: "Validate profile_config entries"
  ansible.builtin.assert:
    that:
      - item.file is defined
    fail_msg: "Each profile_config entry must define 'file'"
  loop: "{{ profile_config }}"
  loop_control:
    label: "{{ item.file | default('undefined') }}"
  when:
    - profile_config is defined
    - profile_config | length > 0

- name: Manage /etc/profile.d entries from profile_config
  when:
    - profile_config is defined
    - profile_config | length > 0
  block:
    - name: "Create file in profile.d"
      ansible.builtin.template:
        src: entry.j2
        dest: "/etc/profile.d/{{ item.file }}"
        mode: '0755'
      loop: "{{ profile_config }}"
      loop_control:
        label: "{{ item.file }}"
      when: item.state | default('present') == 'present'

    - name: "Remove file from profile.d"
      ansible.builtin.file:
        path: "/etc/profile.d/{{ item.file }}"
        state: absent
      loop: "{{ profile_config }}"
      loop_control:
        label: "{{ item.file }}"
      when: item.state | default('present') == 'absent'

- name: "Add external profile files"
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/profile.d/"
    mode: '0755'
  loop: "{{ query('fileglob', profile_files) }}"
  when:
    - profile_files is defined
    - profile_files | length > 0
