---
- name: Verify
  hosts: all
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - name: "Verify tasks"
      when: not (ansible_facts.os_family in ['RedHat', 'Rocky', 'OracleLinux'] and ansible_facts.distribution_major_version == '8')
      block:

        - name: Collect services as facts
          ansible.builtin.service_facts:

        - name: Check service is running
          ansible.builtin.assert:
            that:
              - "ansible_facts.services['rsyslog.service'].state == 'running'"

        - name: "Check if service is runned by good user"
          ansible.builtin.command: "pgrep -u root -f rsyslog_exporter"
          register: process_check
          retries: 10
          delay: 2
          until: process_check.rc == 0
          ignore_errors: true
          changed_when: false

        - name: Validate process running as correct user
          ansible.builtin.assert:
            that: process_check.rc == 0
            fail_msg: "rsyslog_exporter is not running as root user"

        - name: Wait for port 9105 to be listening
          ansible.builtin.wait_for:
            port: 9105
            timeout: 20

        - name: Check urls code
          ansible.builtin.uri:
            url: "http://127.0.0.1:9105/metrics"
            status_code: 200
          register: __url_check
          retries: 10
          delay: 2
          until: __url_check.status is defined and __url_check.status == 200
