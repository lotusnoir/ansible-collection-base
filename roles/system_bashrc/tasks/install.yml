---
- name: "Create a new system default bashrc for user creation"
  ansible.builtin.template:
    src: bashrc.j2
    dest: "{{ bashrc_skel_file }}"
    mode: '0644'
  when:
    - bashrc_configure_skel | bool

- name: Check existence of configured users via getent (local/LDAP/NSS)
  ansible.builtin.getent:
    database: passwd
    key: "{{ item }}"
    fail_key: false
  loop: "{{ bashrc_users_configure }}"
  register: __bashrc_getent_users
  changed_when: false
  tags: [setup]

- name: Warn about users not found via getent (skipped)
  ansible.builtin.debug:
    msg: >-
      User '{{ item.item }}' listed in bashrc_users_configure was not found
      via getent (local passwd / LDAP / NSS) — skipping bashrc deployment
      for this user.
  loop: "{{ __bashrc_getent_users.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.ansible_facts.getent_passwd[item.item] is none
  tags: [setup]

- name: Deploy bashrc for configured users
  ansible.builtin.template:
    src: bashrc.j2
    dest: "{{ __bashrc_user_home }}/.bashrc"
    owner: "{{ item.item }}"
    group: "{{ item.item }}"
    mode: "0640"
  loop: "{{ __bashrc_getent_users.results }}"
  loop_control:
    label: "{{ item.item }}"
    loop_var: item
  vars:
    __bashrc_user_home: >-
      {{
        '/root' if item.item == 'root' else
        bashrc_users_home[item.item] | default(
          (item.ansible_facts.getent_passwd[item.item][4] | default(omit))
          | default(bashrc_users_default_home ~ '/' ~ item.item, true)
        )
      }}
  when: item.ansible_facts.getent_passwd[item.item] is not none    # <-- le fix
  tags: [bashrc]
