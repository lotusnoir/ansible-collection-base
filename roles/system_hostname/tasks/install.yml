---
- name: Manage dbus
  ansible.builtin.include_tasks: dbus.yml
  when: hostname_ensure_dbus | bool

- name: Update hosts file
  ansible.builtin.template:
    src: hosts.j2
    dest: "{{ hostname_hosts_file }}"
    owner: root
    group: root
    mode: '0644'
    backup: true

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ hostname_value }}"
    use: systemd
  register: _newname

- name: Manage service restart
  ansible.builtin.include_tasks: restart_services.yml
  when: hostname_restart_services | length > 0
