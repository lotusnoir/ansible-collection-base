---
galaxy_info:
  author: lotusnoir
  role_name: system_hostname
  description: "Configures the system hostname and manages `/etc/hosts` content. This role renders `/etc/hosts` from a template (base content + optional extra content + optional IPv6 defaults), sets the hostname via systemd, and optionally restarts services impacted by the hostname change."
  license: "Apache License, Version 2.0"
  min_ansible_version: "2.8"

  platforms:
    - name: "Ubuntu"
      versions:
        - "jammy"
        - "noble"
        - "resolute"
    - name: "Debian"
      versions:
        - "bookworm"
        - "bullseye"
        - "trixie"
    - name: "Rocky"
      versions:
        - "10"
        - "8"
        - "9"
    - name: "OracleLinux"
      versions:
        - "10"
        - "8"
        - "9"
    - name: "RedHat"
      versions:
        - "10"
        - "8"
        - "9"

  galaxy_tags:
    - hosts
    - hostname

dependencies: []
