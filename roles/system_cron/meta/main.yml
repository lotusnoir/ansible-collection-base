---
galaxy_info:
  author: lotusnoir
  role_name: system_cron
  description: "Manages /etc/crontab system-wide schedule and arbitrary cron jobs (user crontabs or /etc/cron.d/ files) via the native ansible.builtin.cron module. With default variables, this role deploys the role's default /etc/crontab content (standard Debian-style hourly/daily/weekly/monthly run-parts) and configures no additional cron job."
  license: "Apache License, Version 2.0"
  min_ansible_version: "2.8"

  platforms:
    - name: "Ubuntu"
      versions:
        - "jammy"
        - "noble"
        - "resolute"
    - name: "Debian"
      versions:
        - "bookworm"
        - "bullseye"
        - "trixie"
    - name: "Rocky"
      versions:
        - "10"
        - "8"
        - "9"
    - name: "OracleLinux"
      versions:
        - "10"
        - "8"
        - "9"
    - name: "RedHat"
      versions:
        - "10"
        - "8"
        - "9"

  galaxy_tags:
    - system
    - cron
    - crontabs

dependencies: []
