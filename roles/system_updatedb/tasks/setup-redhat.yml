---
- name: "REDHAT | Install"
  become: true
  ansible.builtin.dnf:
    name: "{{ updatedb_dependencies }}"
    state: "{{ dnf_install_state | default('present') }}"
  register: __pkg_result
  retries: 12
  delay: 10
  until: __pkg_result is success
  tags: [updatedb_package]

- name: "REDHAT | Configure /etc/updatedb.conf"
  become: true
  ansible.builtin.template:
    src: updatedb.conf.j2
    dest: /etc/updatedb.conf
    owner: root
    group: root
    mode: '0644'
    backup: true
  notify: Update updatedb
  tags: [updatedb_config]
