---
_grub_packages:
  default:
    - grub2-efi
  Alpine:
    - grub
  Debian:
    - grub2
grub_packages: "{{ _grub_packages[ansible_facts.os_family] | default(_grub_packages['default']) }}"

_grub_default_validation: "/bin/sh -n"

_grub_cfg_path:
  bios:
    Debian: "/boot/grub/grub.cfg"
    Ubuntu: "/boot/grub/grub.cfg"
    RedHat: "/boot/grub2/grub.cfg"
    default: "/boot/grub/grub.cfg"
  uefi:
    Debian: "/boot/efi/EFI/debian/grub.cfg"
    Ubuntu: "/boot/efi/EFI/ubuntu/grub.cfg"
    RedHat: "/boot/efi/EFI/redhat/grub.cfg"
    default: "/boot/grub/grub.cfg"

_grub_update_cmd:
  Debian: "update-grub"
  Ubuntu: "update-grub"
  RedHat: "grub2-mkconfig -o {{ grub_boot_path }}"
  default: "update-grub"
