---
- name: Update grub
  ansible.builtin.command: >-
    {{ (_grub_update_cmd[ansible_facts.distribution] | default(_grub_update_cmd['default'])) }}
  changed_when: true
  when:
    - ansible_connection not in [ "container", "docker", "community.docker.docker" ]
  notify: Reboot

- name: Reboot
  ansible.builtin.reboot:
  when:
    - grub_reboot|bool
