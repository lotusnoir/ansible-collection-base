---
- name: "Install required packages"
  ansible.builtin.package:
    name: "{{ grub_packages }}"
    state: present

- name: "Check if grub.cfg path exists"
  ansible.builtin.stat:
    path: "{{ grub_boot_path }}"
  register: _grub_cfg_check

- name: "Fallback to BIOS path if detected UEFI path does not exist"
  ansible.builtin.set_fact:
    grub_boot_path: "{{ _grub_cfg_path['bios'][ansible_facts.distribution] | default(_grub_cfg_path['bios']['default']) }}"
    grub_boot_mode: "bios"
  when: not _grub_cfg_check.stat.exists

- name: "Re-check grub.cfg path after potential fallback"
  ansible.builtin.stat:
    path: "{{ grub_boot_path }}"
  register: _grub_cfg_check_final

- name: "Warn if grub.cfg does not exist yet"
  ansible.builtin.debug:
    msg: >-
      grub.cfg introuvable à {{ grub_boot_path }} (mode: {{ grub_boot_mode }}).
      Il sera généré par le handler 'Update grub' en fin de rôle ;
      la tâche de sécurisation des permissions sera ignorée ce run.
  when: not _grub_cfg_check_final.stat.exists

- name: "Deploy /etc/default/grub from template"
  ansible.builtin.template:
    src: grub.j2
    dest: "{{ grub_default_path }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: "{{ _grub_default_validation }} %s"
  notify:
    - Update grub

- name: "Add content on grub.d config files"
  ansible.builtin.blockinfile:
    path: "/etc/grub.d/{{ item.file }}"
    block: "{{ item.value }}"
    create: true
    mode: "0755"
  with_items:
    - "{{ grub_add_filed }}"
  when:
    - grub_add_filed is defined
    - grub_add_filed | length > 0
    - item.regex is not defined
  notify:
    - Update grub

- name: "Change content on grub.d config files"
  ansible.builtin.replace:
    path: "/etc/grub.d/{{ item.file }}"
    regexp: "{{ item.regex }}"
    replace: "{{ item.value }}"
    backup: true
  with_items:
    - "{{ grub_add_filed }}"
  when:
    - grub_add_filed is defined
    - grub_add_filed | length > 0
    - item.regex is defined
  notify:
    - Update grub

- name: "Securise Grub bootloader"
  ansible.builtin.file:
    path: "{{ grub_boot_path }}"
    owner: root
    group: root
    mode: "0600"
  when:
    - grub_sec_bootloader | bool
    - _grub_cfg_check_final.stat.exists

- name: "Flush handlers"
  ansible.builtin.meta: flush_handlers
