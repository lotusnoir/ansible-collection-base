---
galaxy_info:
  author: lotusnoir
  role_name: system_grub
  description: "Hardens the GRUB2 bootloader configuration: manages kernel command-line parameters (`/etc/default/grub`), sets a boot loader password to restrict menu editing/recovery mode, patches `/etc/grub.d/*` scripts, and secures the permissions of the generated `grub.cfg`. Supports both BIOS and UEFI boot modes, auto-detected at runtime."
  license: "Apache License, Version 2.0"
  min_ansible_version: "2.8"

  platforms:
    - name: "Ubuntu"
      versions:
        - "jammy"
        - "noble"
        - "resolute"
    - name: "Debian"
      versions:
        - "bookworm"
        - "bullseye"
        - "trixie"
    - name: "Rocky"
      versions:
        - "10"
        - "8"
        - "9"
    - name: "OracleLinux"
      versions:
        - "10"
        - "8"
        - "9"
    - name: "RedHat"
      versions:
        - "10"
        - "8"
        - "9"

  galaxy_tags:
    - system
    - boot
    - grub
    - grub2
    - security
    - hardening
    - anssi
    - cis

dependencies: []
