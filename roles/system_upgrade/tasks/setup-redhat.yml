---
# Hold specific package
- name: "REDHAT | install required packages (versionlock + yum-utils)"
  become: true
  ansible.builtin.dnf:
    name: "{{ required_package }}"
    state: present
  register: __pkg_result
  retries: 12
  delay: 10
  until: __pkg_result is success
  tags: [upgrade_run, upgrade_clean]

- name: "REDHAT | list actual hold packages"
  ansible.builtin.command: yum versionlock list
  register: _upgrade_hold_pkg_actual
  changed_when: false
  tags: [upgrade_hold]
  # noqa: command-instead-of-module
  # No read-only "list" action exists in community.general.yum_versionlock;
  # this command is only used to compute a diff, never to change state.

- name: "REDHAT | list hold pkgs not holded yet"
  ansible.builtin.set_fact:
    pkg_to_hold: "{{ upgrade_hold_pkg | difference(_upgrade_hold_pkg_actual.stdout_lines) }}"
  when:
    - upgrade_hold_pkg is defined
    - upgrade_hold_pkg | length > 0
  tags: [upgrade_hold]

- name: "REDHAT | list unhold pkgs still holded"
  ansible.builtin.set_fact:
    pkg_to_unhold: "{{ upgrade_unhold_pkg | intersect(_upgrade_hold_pkg_actual.stdout_lines) }}"
  when:
    - upgrade_unhold_pkg is defined
    - upgrade_unhold_pkg | length > 0
  tags: [upgrade_hold]

- name: "REDHAT | hold packages"
  become: true
  community.general.yum_versionlock:
    name: "{{ pkg_to_hold }}"
    state: present
  when:
    - pkg_to_hold is defined
    - pkg_to_hold | length > 0
  tags: [upgrade_hold]

- name: "REDHAT | unhold packages to update them"
  become: true
  community.general.yum_versionlock:
    name: "{{ pkg_to_unhold }}"
    state: absent
  when:
    - pkg_to_unhold is defined
    - pkg_to_unhold | length > 0
  tags: [upgrade_hold]

- name: "REDHAT | set max kernels to keep"
  become: true
  ansible.builtin.lineinfile:
    path: /etc/yum.conf
    regexp: "^installonly_limit="
    line: "installonly_limit={{ upgrade_yum_max_kernels }}"
  tags: [upgrade_run]

- name: "REDHAT | collect upgradable packages"
  ansible.builtin.command: yum check-update
  register: pkglist
  changed_when: false
  failed_when: pkglist.rc not in [0, 100]
  tags: [upgrade_run]

- name: "REDHAT | show pending updates"
  ansible.builtin.debug:
    var: pkglist.stdout_lines
  tags: [upgrade_run]

- name: "REDHAT | ask for upgrade confirmation"
  ansible.builtin.pause:
    prompt: "Do you want to apply this upgrade?"
  when: upgrade_pkgs_confirmation | bool
  tags: [upgrade_run]

- name: "REDHAT | upgrade all packages"
  become: true
  ansible.builtin.dnf:
    name: "*"
    state: latest
    nobest: "{{ upgrade_allow_nobest | bool }}"
  register: __pkg_result
  retries: 12
  delay: 10
  until: __pkg_result is success
  when: not upgrade_simulation | bool
  tags: [upgrade_run]

- name: "REDHAT | remove leaf packages not protected by hold list"
  become: true
  ansible.builtin.shell: |
    set -o pipefail
    package-cleanup --leaves --exclude="{{ (upgrade_hold_pkg | default([])) | join(',') }}"
  register: leaf_cleanup
  changed_when: "'No Problems Found' not in leaf_cleanup.stdout"
  when:
    - upgrade_clean is defined
    - upgrade_clean | bool
  tags: [upgrade_clean]

- name: "REDHAT | packages clean all"
  become: true
  ansible.builtin.command: yum clean all
  changed_when: true
  when:
    - upgrade_clean is defined
    - upgrade_clean | bool
  tags: [upgrade_clean]

# check if we need a reboot, only on hosts that updated (kernel change)
- name: "REDHAT | check if reboot needed"
  ansible.builtin.command: needs-restarting -r
  register: needs_restart
  changed_when: false
  failed_when: false
  when:
    - upgrade_autoreboot | bool
  tags: [upgrade_reboot]

- name: "REDHAT | prompt before rebooting"
  ansible.builtin.pause:
    prompt: "Press ENTER to reboot {{ ansible_host }} now, or Ctrl+C to abort."
  when:
    - upgrade_autoreboot | bool
    - needs_restart.rc == 1
    - upgrade_reboot_confirmation | bool
  tags: [upgrade_reboot]

- name: "REDHAT | rebooting machine"
  become: true
  ansible.builtin.shell: sleep 2 && shutdown -r now "Ansible updates triggered"
  changed_when: true
  async: 1
  poll: 0
  when:
    - upgrade_autoreboot | bool
    - needs_restart.rc == 1
  tags: [upgrade_reboot]

# Always wait for the host to come back once a reboot has been triggered.
- name: "REDHAT | waiting for the machine to come back"
  become: false
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    state: started
    port: 22
    delay: 30
    timeout: 300
  delegate_to: localhost
  when:
    - upgrade_autoreboot | bool
    - needs_restart.rc == 1
  tags: [upgrade_reboot]
