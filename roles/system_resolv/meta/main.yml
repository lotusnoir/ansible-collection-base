---
galaxy_info:
  author: lotusnoir
  role_name: system_resolv
  description: "Configures `/etc/resolv.conf` (nameservers, search domains, sortlist, resolver options), optionally removes the `resolvconf` package and disables DNS management by NetworkManager so the rendered file is not overwritten. With default variables the role changes nothing on the system — `resolv.conf` is only rendered once `resolv_nameservers` is set."
  license: "Apache License, Version 2.0"
  min_ansible_version: "2.8"

  platforms:
    - name: "Ubuntu"
      versions:
        - "jammy"
        - "noble"
        - "resolute"
    - name: "Debian"
      versions:
        - "bookworm"
        - "bullseye"
        - "trixie"
    - name: "Rocky"
      versions:
        - "10"
        - "8"
        - "9"
    - name: "OracleLinux"
      versions:
        - "10"
        - "8"
        - "9"
    - name: "RedHat"
      versions:
        - "10"
        - "8"
        - "9"

  galaxy_tags:
    - dns
    - resolv

dependencies: []
