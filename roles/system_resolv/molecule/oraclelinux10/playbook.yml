---
- name: Run role
  hosts: all
  become: true
  any_errors_fatal: true
  gather_facts: false

  pre_tasks:
    - name: Get minimal facts
      ansible.builtin.setup:
        gather_subset:
          - '!all'
          - distribution

  tasks:
    - name: Include role
      ansible.builtin.include_role:
        name: ansible-system_resolv
      vars:
        resolv_resolvconf_remove: true
        resolv_file: "/etc/resolv2.conf"
        resolv_nameservers:
          - 127.0.0.1
