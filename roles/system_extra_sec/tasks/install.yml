---
- name: "/etc/security/pwquality.conf"
  ansible.builtin.lineinfile:
    create: true
    path: /etc/security/pwquality.conf
    regexp: "^{{ item }}"
    line: "{{ item }}"
    mode: 420
    state: present
  with_items:
    - "dcredit = -1"
    - "lcredit = -1"
    - "ocredit = -1"
    - "ucredit = -1"
    - "minlen = 16"
    - "minclass = 4"
  when:
    - extra_sec_pwquality_update | bool

- name: "Create crontab.allow if not exists"
  ansible.builtin.copy:
    content: "{{ extra_sec_crontab_allow_content }}"
    dest: "{{ item }}"
    force: "no"
    owner: root
    group: "{{ 'crontab' if ansible_facts.os_family == 'Debian' else 'root' }}"
    mode: "640"
  with_items:
    - /etc/cron.allow
  when: extra_sec_crontab_allow | bool

- name: "Create at.allow if not exists"
  ansible.builtin.copy:
    content: "{{ extra_sec_at_allow_content }}"
    dest: "{{ item }}"
    force: "no"
    owner: root
    group: root
    mode: "600"
  with_items:
    - /etc/at.allow
  when: extra_sec_at_allow | bool

- name: "Replace issue content"
  ansible.builtin.copy:
    content: "{{ extra_sec_issue_content }}"
    dest: "{{ item }}"
    mode: "0600"
  with_items:
    - /etc/issue
    - /etc/issue.net
  when: extra_sec_issue_update | bool

- name: Set password encryption method to yescrypt
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^ENCRYPT_METHOD'
    line: 'ENCRYPT_METHOD    YESCRYPT'
    state: present

- name: Ensure rounds=11 is set on pam_unix.so password line
  ansible.builtin.lineinfile:
    path: /etc/pam.d/common-password
    backrefs: true
    regexp: '^(password\s+\[success=\d+ default=ignore\]\s+pam_unix\.so(?:(?!rounds=).)*)$'
    line: '\1 rounds=11'
  when:
    - ansible_facts['os_family'] == "Debian"

- name: Get all local users from /etc/passwd
  ansible.builtin.getent:
    database: passwd
    split: ':'

- name: Create local_users variable from the getent output
  ansible.builtin.set_fact:
    local_users: '{{ ansible_facts.getent_passwd | dict2items }}'

- name: Test for existence home directories to avoid creating them.
  ansible.builtin.stat:
    path: '{{ item.value[4] }}'
  register: path_exists
  loop: '{{ local_users }}'
  when:
    - item.value[1]|int >= 1000
    - item.value[1]|int != 65534
    - item.value[4] != "/"

- name: Ensure interactive local users have proper permissions on their respective home directories
  ansible.builtin.file:
    path: '{{ item.0.value[4] }}'
    mode: u-s,g-w-s,o=-
    follow: false
    recurse: true
  loop: '{{ local_users | zip(path_exists.results) | list }}'
  when:
    - item.1.stat is defined and item.1.stat.exists

- name: "Change log permissions"
  ansible.builtin.command: find /var/log -type f -exec chmod g-wx,o-rwx '{}' + -o -type d -exec chmod g-w,o-rwx '{}' +
  changed_when: false
  failed_when: false
  when: extra_sec_logs_perms | bool

- name: "Change umask in /etc/init.d/rc"
  ansible.builtin.lineinfile:
    path: /etc/init.d/rc
    regexp: "^umask 022"
    line: umask 027
  when: extra_sec_umask_rc | bool

- name: Désactiver les consoles TTY 2 à 6
  ansible.builtin.systemd:
    name: "getty@tty{{ item }}.service"
    enabled: false
    masked: true
    state: stopped
  loop: [2, 3, 4, 5, 6]

