---
- name: "/etc/security/pwquality.conf"
  ansible.builtin.lineinfile:
    create: true
    path: /etc/security/pwquality.conf
    regexp: "^{{ item.key }}\\s*="
    line: "{{ item.key }} = {{ item.value }}"
    mode: '0644'
    state: present
  loop: "{{ extra_sec_pwquality_settings | dict2items }}"
  when: extra_sec_pwquality_update | bool
  tags: [pwquality]

- name: "Create crontab.allow if not exists"
  ansible.builtin.copy:
    content: "{{ extra_sec_crontab_allow_content }}"
    dest: /etc/cron.allow
    force: false
    owner: root
    group: "{{ 'crontab' if ansible_facts.os_family == 'Debian' else 'root' }}"
    mode: '0640'
  when: extra_sec_crontab_allow | bool
  tags: [cron_allow]

- name: "Create at.allow if not exists"
  ansible.builtin.copy:
    content: "{{ extra_sec_at_allow_content }}"
    dest: /etc/at.allow
    force: false
    owner: root
    group: root
    mode: '0600'
  when: extra_sec_at_allow | bool
  tags: [at_allow]

- name: "Replace issue content"
  ansible.builtin.copy:
    content: "{{ extra_sec_issue_content }}"
    dest: "{{ item }}"
    mode: '0644'
  loop:
    - /etc/issue
    - /etc/issue.net
  when: extra_sec_issue_update | bool
  tags: [issue]

- name: Set password encryption method to yescrypt
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^ENCRYPT_METHOD'
    line: 'ENCRYPT_METHOD    YESCRYPT'
    state: present
  when:
    - extra_sec_encrypt_method_update | bool
    - ansible_facts.os_family == "Debian" or (ansible_facts.os_family == "RedHat" and (ansible_facts.distribution_major_version | int) >= 9)
  tags: [password_policy]

- name: Ensure rounds are set on pam_unix.so password line (Debian)
  ansible.builtin.lineinfile:
    path: /etc/pam.d/common-password
    backrefs: true
    regexp: '^(password\s+\[success=\d+ default=ignore\]\s+pam_unix\.so(?:(?!rounds=).)*)$'
    line: '\1 rounds={{ extra_sec_pam_rounds }}'
  when:
    - extra_sec_pam_rounds_update | bool
    - ansible_facts.os_family == "Debian"
  tags: [password_policy]

- name: Ensure rounds are set on pam_unix.so password line (RedHat family)
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    backrefs: true
    regexp: '^(password\s+sufficient\s+pam_unix\.so(?:(?!rounds=).)*)$'
    line: '\1 rounds={{ extra_sec_pam_rounds }}'
  loop:
    - /etc/pam.d/system-auth
    - /etc/pam.d/password-auth
  when:
    - extra_sec_pam_rounds_update | bool
    - ansible_facts.os_family == "RedHat"
  tags: [password_policy]

- name: Harden interactive users' home directory permissions
  when: extra_sec_home_perms_update | bool
  tags: [home_perms]
  block:
    - name: Get all local/LDAP users from passwd (NSS)
      ansible.builtin.getent:
        database: passwd
        split: ':'

    - name: Build local_users variable from the getent output
      ansible.builtin.set_fact:
        local_users: '{{ ansible_facts.getent_passwd | dict2items }}'

    - name: Test for existence of home directories to avoid creating them
      ansible.builtin.stat:
        path: '{{ item.value[4] }}'
      register: path_exists
      loop: '{{ local_users }}'
      loop_control:
        label: "{{ item.key }}"
      when:
        - item.value[1] | int >= extra_sec_home_perms_min_uid
        - item.value[1] | int != 65534
        - item.value[4] != "/"

    - name: Ensure interactive local users have proper permissions on their home directories
      ansible.builtin.file:
        path: '{{ item.0.value[4] }}'
        mode: u-s,g-w-s,o=-
        follow: false
        recurse: true
      loop: '{{ local_users | zip(path_exists.results) | list }}'
      loop_control:
        label: "{{ item.0.key }}"
      when:
        - item.1.stat is defined and item.1.stat.exists

- name: Disable extra TTY consoles (getty@tty2-6 by default)
  ansible.builtin.systemd:
    name: "getty@tty{{ item }}.service"
    enabled: false
    masked: true
    state: stopped
  loop: "{{ extra_sec_disable_extra_ttys_list }}"
  when: extra_sec_disable_extra_ttys | bool
  tags: [tty]

- name: "Change log permissions"
  ansible.builtin.command: find /var/log -type f -exec chmod g-wx,o-rwx '{}' + -o -type d -exec chmod g-w,o-rwx '{}' +
  register: __extra_sec_log_perms
  changed_when: false
  failed_when: __extra_sec_log_perms.rc != 0
  when: extra_sec_logs_perms | bool
  tags: [logs_perms]

- name: "Change umask in /etc/init.d/rc"
  ansible.builtin.lineinfile:
    path: /etc/init.d/rc
    regexp: "^umask 022"
    line: umask 027
  when: extra_sec_umask_rc | bool
  tags: [umask]

- name: Configure System to Forward All Mail For The Root Account - Set /etc/aliases content if doesnt exist
  ansible.builtin.copy:
    dest: /etc/aliases
    content: |
      root: {{ extra_sec_postfix_root_mail_alias }}
    mode: '0644'
    force: false
  when: extra_sec_change_root_mail_alias
  notify: Update postfix aliases
