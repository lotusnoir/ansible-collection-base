---
galaxy_info:
  author: lotusnoir
  role_name: system_extra_sec
  description: "Applies extra CIS-style security hardening not covered by dedicated roles: password quality policy, password hashing algorithm/rounds, login banners, cron/at access restriction, interactive users' home directory permissions, log file permissions, default umask, and extra TTY consoles. Every hardening action is gated by its own boolean variable (all false by default except issue banner) — with default variables, this role only deploys the login banner (/etc/issue, /etc/issue.net) and changes nothing else on the system."
  license: "Apache License, Version 2.0"
  min_ansible_version: "2.8"

  platforms:
    - name: "Ubuntu"
      versions:
        - "jammy"
        - "noble"
        - "resolute"
    - name: "Debian"
      versions:
        - "bookworm"
        - "bullseye"
        - "trixie"
    - name: "Rocky"
      versions:
        - "10"
        - "8"
        - "9"
    - name: "OracleLinux"
      versions:
        - "10"
        - "8"
        - "9"
    - name: "RedHat"
      versions:
        - "10"
        - "8"
        - "9"

  galaxy_tags:
    - system
    - security
    - cis

dependencies: []
