---
dependency:
  name: galaxy
  options:
    role-file: requirements.yml
    requirements-file: ""   # suppress collection install entirely if unsupported by your molecule_plugins version

driver:
  name: docker

scenario:
  name: all
  test_sequence:
    - destroy
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy

platforms:
  - name: apps-chrony-exporter-ubuntu22
    image: lotusnoir/ansible_molecule_test_images:ubuntu22
    pull: false
    pre_build_image: true
    cgroupns_mode: host
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    groups:
      - python3
