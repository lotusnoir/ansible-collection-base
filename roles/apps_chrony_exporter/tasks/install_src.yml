---
- name: "Get current version"
  ansible.builtin.shell: |
    set -o pipefail
    {{ chrony_exporter_install_dir }}/{{ chrony_exporter_bin_name }} --version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1
  args:
    executable: /bin/bash
  changed_when: false
  register: __installed_version
  when: __installed_bin.stat.exists
  # Switched from "grep -oP" (PCRE) to "grep -oE" (POSIX ERE): -P requires
  # grep built with PCRE support, which is missing on some minimal/busybox
  # images. On those, -P silently matched nothing rather than erroring,
  # making the version check always look "different" and forcing a
  # reinstall on every single run. -E is supported everywhere GNU/BSD grep
  # ships.

- name: "Get latest tag"
  ansible.builtin.uri:
    url: "{{ _chrony_exporter_release_api_url }}"
  failed_when: false
  register: __github_latest
  when:
    - chrony_exporter_version == 'latest'
    - chrony_exporter_install_origin == "internet"

- name: "Replace version fact to latest"
  ansible.builtin.set_fact:
    chrony_exporter_version: "{{ __github_latest.json.tag_name | default(_chrony_exporter_default_version) | replace('v', '') }}"
  when:
    - chrony_exporter_version == 'latest'
    - chrony_exporter_install_origin == "internet"

- name: "Install tasks"
  when: (not __installed_bin.stat.exists) or
      (__installed_version is defined and __installed_version.stdout is defined and chrony_exporter_version != (__installed_version.stdout | trim)) or
      chrony_exporter_install_force
  block:
    - name: "Create user"
      ansible.builtin.include_tasks: create_user.yml
      when: chrony_exporter_user != "root"

    - name: "Create dirs"
      become: true
      ansible.builtin.file:
        path: "{{ item | safe | trim }}"
        state: directory
        owner: "{{ chrony_exporter_user }}"
        group: "{{ chrony_exporter_group }}"
        mode: "0755"
      loop:
        - "{{ chrony_exporter_temp_dir }}/{{ role_path | basename }}"

    - name: "Install requierements"
      ansible.builtin.package:
        name: ["ca-certificates", "unzip", "tar"]
        state: present
      become: true
      register: __pkg_result
      retries: 12
      delay: 10
      until: __pkg_result is success

    - name: "Get release metadata for checksum verification"
      ansible.builtin.uri:
        url: "{{ _chrony_exporter_release_tag_api_url }}"
      failed_when: false
      register: __github_release
      when:
        - chrony_exporter_verify_checksum
        - chrony_exporter_install_origin == "internet"

    - name: "Set package checksum fact"
      ansible.builtin.set_fact:
        __chrony_exporter_checksum: "{{ _digest }}"
      vars:
        _digest: >-
          {{ __github_release.json.assets
             | default([])
             | selectattr('name', 'equalto', chrony_exporter_pkg_name)
             | map(attribute='digest')
             | list | first | default('', true) }}
      when:
        - chrony_exporter_verify_checksum
        - chrony_exporter_install_origin == "internet"
        - _digest | length > 0

    - name: "Copy local binary"
      ansible.builtin.copy:
        src: "{{ chrony_exporter_local_files }}"
        dest: "{{ chrony_exporter_temp_dir }}/{{ chrony_exporter_pkg_name }}"
        mode: "0755"
      when: chrony_exporter_install_origin == "local"

    - name: "Verify checksum of local archive"
      ansible.builtin.stat:
        path: "{{ chrony_exporter_temp_dir }}/{{ chrony_exporter_pkg_name }}"
        checksum_algorithm: sha256
      register: __local_pkg_stat
      failed_when: >-
        chrony_exporter_local_checksum | length > 0 and
        __local_pkg_stat.stat.checksum != chrony_exporter_local_checksum
      when:
        - chrony_exporter_install_origin == "local"
        - chrony_exporter_verify_checksum

    - name: "Download binary by host"
      ansible.builtin.get_url:
        url: "{{ chrony_exporter_dl_url }}"
        dest: "{{ chrony_exporter_temp_dir }}/{{ chrony_exporter_pkg_name }}"
        checksum: "{{ __chrony_exporter_checksum | default(omit) }}"
        timeout: 60
        mode: "0644"
        force: true
      register: __pkg_result
      retries: 12
      delay: 10
      until: __pkg_result is success
      when:
        - chrony_exporter_install_origin == "internet"
        - chrony_exporter_dl_executor == "host"

    - name: "Download binary by localhost"
      ansible.builtin.get_url:
        url: "{{ chrony_exporter_dl_url }}"
        dest: "{{ chrony_exporter_temp_dir }}/{{ chrony_exporter_pkg_name }}"
        checksum: "{{ __chrony_exporter_checksum | default(omit) }}"
        timeout: 60
        mode: "0644"
        force: true
      delegate_to: localhost
      register: __pkg_result
      retries: 12
      delay: 10
      until: __pkg_result is success
      when:
        - chrony_exporter_install_origin == "internet"
        - chrony_exporter_dl_executor == "localhost"

    - name: "Fetch downloaded archive to remote host"
      ansible.builtin.copy:
        src: "{{ chrony_exporter_temp_dir }}/{{ chrony_exporter_pkg_name }}"
        dest: "{{ chrony_exporter_temp_dir }}/{{ chrony_exporter_pkg_name }}"
        mode: "0755"
      when:
        - chrony_exporter_install_origin == "internet"
        - chrony_exporter_dl_executor == "localhost"

    - name: "Unarchive"
      become: true
      ansible.builtin.unarchive:
        src: "{{ chrony_exporter_temp_dir }}/{{ chrony_exporter_pkg_name }}"
        dest: "{{ chrony_exporter_temp_dir }}/{{ role_path | basename }}"
        extra_opts: [--strip-components=1]
        remote_src: true
        mode: "0644"

    - name: "Install binary"
      become: true
      ansible.builtin.copy:
        src: "{{ chrony_exporter_temp_dir }}/{{ role_path | basename }}/chrony_exporter"
        dest: "{{ chrony_exporter_install_dir }}/{{ chrony_exporter_bin_name }}"
        remote_src: true
        owner: "{{ chrony_exporter_user }}"
        group: "{{ chrony_exporter_group }}"
        mode: "0755"
      notify: Restart chrony_exporter
