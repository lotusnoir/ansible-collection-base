---
- name: Update locales
  become: true
  ansible.builtin.command: dpkg-reconfigure --frontend noninteractive locales
  register: __locales_update
  changed_when: __locales_update.rc == 0
  failed_when: __locales_update.rc != 0

- name: Reconfigure keyboard
  become: true
  ansible.builtin.command: setupcon --save-only --force
  register: __keyboard_reconfigure
  changed_when: __keyboard_reconfigure.rc == 0
  failed_when: __keyboard_reconfigure.rc != 0
