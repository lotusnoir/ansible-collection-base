---
- name: REDHAT | Install languages pack
  ansible.builtin.dnf:
    name:
      - "langpacks-{{ item.split('_')[0] }}"
      - "glibc-langpack-{{ item.split('_')[0] }}"
    state: present
  register: __pkg_result
  retries: 12
  delay: 10
  until: __pkg_result is success
  loop: "{{ locales_present }}"
  when:
    - locales_present is defined
    - locales_present | length > 0
  tags: [locales_packages]

- name: REDHAT | Remove languages pack
  ansible.builtin.dnf:
    name:
      - "langpacks-{{ item.split('_')[0] }}"
      - "glibc-langpack-{{ item.split('_')[0] }}"
    state: absent
  register: __pkg_result
  retries: 12
  delay: 10
  until: __pkg_result is success
  loop: "{{ locales_absent }}"
  when:
    - locales_absent is defined
    - locales_absent | length > 0
  tags: [locales_packages]

- name: REDHAT | Install keyboard pack
  ansible.builtin.dnf:
    name: kbd
    state: present
  register: __pkg_result
  retries: 12
  delay: 10
  until: __pkg_result is success
  tags: [locales_keyboard]

### Default locale (LANG + LC_*) — idempotent via /etc/locale.conf comparison

- name: "REDHAT | Read current locale configuration"
  ansible.builtin.slurp:
    src: /etc/locale.conf
  register: __locales_current_raw
  failed_when: false
  changed_when: false
  when:
    - locales_default is defined
    - locales_default.lang is defined
  tags: [locales_default]

- name: "REDHAT | Parse current locale configuration"
  ansible.builtin.set_fact:
    __locales_current: >-
      {{
        (__locales_current_raw.content | default('') | b64decode)
        | regex_findall('^([A-Z_]+)=(.*)$', multiline=true)
        | items2dict(key_name=0, value_name=1)
        if (__locales_current_raw is defined and __locales_current_raw.content is defined)
        else {}
      }}
  when:
    - locales_default is defined
    - locales_default.lang is defined
  tags: [locales_default]

- name: "REDHAT | Reset desired locale configuration"
  ansible.builtin.set_fact:
    __locales_desired: "{{ {'LANG': locales_default.lang} }}"
  when:
    - locales_default is defined
    - locales_default.lang is defined
  tags: [locales_default]

- name: "REDHAT | Build desired locale configuration"
  ansible.builtin.set_fact:
    __locales_desired: "{{ __locales_desired | combine({item | upper: locales_default[item]}) }}"
  loop:
    - language
    - lc_address
    - lc_all
    - lc_collate
    - lc_ctype
    - lc_identification
    - lc_measurement
    - lc_messages
    - lc_monetary
    - lc_name
    - lc_numeric
    - lc_paper
    - lc_response
    - lc_telephone
    - lc_time
  when:
    - locales_default is defined
    - locales_default.lang is defined
    - locales_default[item] is defined
  tags: [locales_default]

- name: "REDHAT | Set default + LC_* locales via localectl"
  ansible.builtin.command: >-
    localectl set-locale
    {% for key, value in __locales_desired.items() %}{{ key }}={{ value | quote }} {% endfor %}
  changed_when: false
  when:
    - locales_default is defined
    - locales_default.lang is defined
    - __locales_desired != __locales_current
  tags: [locales_default]

### Keyboard layout — idempotent via `localectl status` comparison

- name: "REDHAT | Check current keymap"
  ansible.builtin.command: localectl status
  register: __locales_status
  changed_when: false
  when: locales_keyboard_layout is defined
  tags: [locales_keyboard]

- name: Set localectl keymap (RHEL/systemd-based)
  ansible.builtin.command: "localectl set-keymap {{ locales_keyboard_layout }}"
  changed_when: false
  when:
    - locales_keyboard_layout is defined
    - "('VC Keymap: ' ~ locales_keyboard_layout) not in __locales_status.stdout"
  tags: [locales_keyboard]
