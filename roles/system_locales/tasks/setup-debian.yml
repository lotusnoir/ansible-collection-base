---
- name: "DEBIAN | Install requirements"
  ansible.builtin.package:
    name: "{{ locales_dependencies }}"
    state: present
  register: __pkg_result
  retries: 12
  delay: 10
  until: __pkg_result is success
  when:
    - locales_present is defined
    - locales_present | length > 0
  tags: [locales_packages]

- name: "UBUNTU | Install language packs"
  ansible.builtin.package:
    name:
      - "language-pack-{{ item.split('_')[0] | lower }}"
      - "language-pack-{{ item.split('_')[0] | lower }}-base"
    state: present
  register: __pkg_result
  retries: 12
  delay: 10
  until: __pkg_result is success
  loop: "{{ locales_present }}"
  when:
    - ansible_facts.distribution == 'Ubuntu'
    - locales_present is defined
    - locales_present | length > 0
    - '"_" in item'   # skip locales without a language_COUNTRY form (e.g. C.UTF-8)
  notify: Update locales
  tags: [locales_packages]

- name: "UBUNTU | Remove language packs"
  ansible.builtin.package:
    name:
      - "language-pack-{{ item.split('_')[0] | lower }}"
      - "language-pack-{{ item.split('_')[0] | lower }}-base"
    state: absent
  register: __pkg_result
  retries: 12
  delay: 10
  until: __pkg_result is success
  loop: "{{ locales_absent }}"
  when:
    - ansible_facts.distribution == 'Ubuntu'
    - locales_absent is defined
    - locales_absent | length > 0
    - '"_" in item'
  notify: Update locales
  tags: [locales_packages]

- name: "DEBIAN | Detect locale gen file"
  ansible.builtin.stat:
    path: "{{ locales_gen_file }}"
  register: __locales_gen_file_stat
  tags: [locales_gen]

- name: "DEBIAN | Create locale gen file if not exist"
  ansible.builtin.file:
    path: "{{ locales_gen_file }}"
    mode: '0644'
    state: touch
  when: not __locales_gen_file_stat.stat.exists
  tags: [locales_gen]

- name: "DEBIAN | Ensure locales are present"
  community.general.locale_gen:
    name: "{{ item }}"
    state: present
  loop: "{{ locales_present }}"
  when:
    - locales_present is defined
    - locales_present | length > 0
  tags: [locales_gen]

- name: "DEBIAN | Ensure locales are absent"
  community.general.locale_gen:
    name: "{{ item }}"
    state: absent
  loop: "{{ locales_absent }}"
  when:
    - locales_absent is defined
    - locales_absent | length > 0
  tags: [locales_gen]

- name: "DEBIAN | Set default locale"
  ansible.builtin.template:
    src: locale.j2
    dest: /etc/default/locale
    owner: root
    group: root
    mode: '0644'
  when:
    - locales_default is defined
    - locales_default | length > 0
  tags: [locales_default]

- name: "DEBIAN | Ensure console-setup package is installed"
  ansible.builtin.apt:
    name: console-setup
    state: present
  register: __pkg_result
  retries: 12
  delay: 10
  until: __pkg_result is success
  tags: [locales_keyboard]

- name: "DEBIAN | Set keymap"
  ansible.builtin.template:
    src: keyboard.j2
    dest: /etc/default/keyboard
    owner: root
    group: root
    mode: '0644'
  notify: Reconfigure keyboard
  tags: [locales_keyboard]
