---
- name: "Ensure logrotate is installed"
  ansible.builtin.package:
    name: logrotate
    state: present
  register: __pkg_result
  retries: 3
  delay: 5
  until: __pkg_result is success
  tags: [logrotate_package]

- name: "Change default config"
  ansible.builtin.template:
    src: logrotate.conf.j2
    dest: "/etc/logrotate.conf"
    owner: root
    group: root
    mode: "0644"
    validate: "logrotate -d %s"
  when:
    - logrotate_default_conf is defined
    - logrotate_default_conf | length > 0
  notify: Force logrotate run
  tags: [logrotate_config]

- name: "Setup logrotate.d files"
  ansible.builtin.template:
    src: logrotate.d.j2
    dest: "{{ logrotate_conf_path }}{{ item.name }}"
    owner: root
    group: root
    mode: "0640"
    validate: "logrotate -d %s"
  loop: "{{ logrotate_apps_conf }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - logrotate_apps_conf is defined
    - logrotate_apps_conf | length > 0
  notify: Force logrotate run
  tags: [logrotate_apps]

- name: Ensure /var/log has correct permissions and ownership
  ansible.builtin.file:
    path: /var/log
    owner: root
    group: root
    mode: "0755"
    state: directory
  when: logrotate_var_log_perms_update | bool
  tags: [logrotate_var_log_perms]
