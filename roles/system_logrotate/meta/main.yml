---
galaxy_info:
  author: lotusnoir
  role_name: system_logrotate
  description: "Installs and configures logrotate: optional override of the global /etc/logrotate.conf, a list of per-application logrotate.d files, and optional /var/log ownership/permission enforcement. A forced logrotate run can be triggered automatically, but only when a managed configuration file actually changed. With default variables, this role only ensures the logrotate package is installed and leaves all configuration untouched."
  license: "Apache License, Version 2.0"
  min_ansible_version: "2.8"

  platforms:
    - name: "Ubuntu"
      versions:
        - "jammy"
        - "noble"
        - "resolute"
    - name: "Debian"
      versions:
        - "bookworm"
        - "bullseye"
        - "trixie"
    - name: "Rocky"
      versions:
        - "10"
        - "8"
        - "9"
    - name: "OracleLinux"
      versions:
        - "10"
        - "8"
        - "9"
    - name: "RedHat"
      versions:
        - "10"
        - "8"
        - "9"

  galaxy_tags:
    - system
    - log
    - logrotate

dependencies: []
