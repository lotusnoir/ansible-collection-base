---
- name: "Assert OS-specific variables are defined"
  ansible.builtin.assert:
    that:
      - _chrony_config is defined
      - _chrony_service is defined
      - _chrony_keyfile is defined
      - _chrony_env_file is defined
      - _chrony_env_var is defined
    fail_msg: >-
      One or more OS-specific variables (_chrony_config, _chrony_service,
      _chrony_keyfile, _chrony_env_file, _chrony_env_var) are undefined.
      This usually means vars/{{ ansible_facts.distribution | lower }}.yml
      (or an equivalent os_family file) was not found/loaded for this OS.

- name: "Install Chrony"
  ansible.builtin.package:
    name: chrony
    state: present
  become: true
  register: __pkg_result
  retries: 12
  delay: 10
  until: __pkg_result is success
  # Previously gated behind "when chronyd binary is not already present",
  # which meant package updates (e.g. bumping chrony version via repo
  # config) were silently skipped forever after the first install.
  # ansible.builtin.package is already idempotent, so just always run it;
  # chrony_install_force is no longer needed for this purpose.

- name: "Ensure log directories exist"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ chrony_user }}"
    group: "{{ chrony_group }}"
    mode: "0750"
  become: true
  loop:
    - "{{ chrony_logdir }}"

- name: "Deploy keyfile"
  ansible.builtin.include_tasks: keyfile.yml
  when: chrony_keyfile_enabled

- name: "Configuring Chrony"
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: "{{ _chrony_config }}"
    owner: "{{ chrony_user }}"
    group: "{{ chrony_group }}"
    mode: "0644"
    backup: "{{ chrony_backup_files }}"
  become: true
  register: __chrony_config
  notify:
    - "Restart chrony"

- name: "Configuring Chrony daemon options"
  ansible.builtin.template:
    src: chrony.env.j2
    dest: "{{ _chrony_env_file }}"
    owner: "{{ chrony_user }}"
    group: "{{ chrony_group }}"
    mode: "0644"
    backup: "{{ chrony_backup_files }}"
  become: true
  notify:
    - "Restart chrony"
  # Fixed: previously hardcoded to Debian's /etc/default/chrony with
  # DAEMON_OPTS= syntax regardless of OS, so chrony_daemon_opts silently
  # had no effect on RHEL-family hosts (which read OPTIONS= from
  # /etc/sysconfig/chronyd instead). Now OS-aware via vars/*.yml.

- name: "Apply configuration immediately to validate it"  # noqa: no-handler
  ansible.builtin.meta: flush_handlers
  when: __chrony_config.changed

- name: "Collect service state after restart"
  ansible.builtin.service_facts:
  when: __chrony_config.changed

- name: "Restore previous configuration if the service failed to start"
  ansible.builtin.copy:
    src: "{{ __chrony_config.backup_file }}"
    dest: "{{ _chrony_config }}"
    owner: "{{ chrony_user }}"
    group: "{{ chrony_group }}"
    mode: "0644"
    remote_src: true
  become: true
  when:
    - __chrony_config.changed
    - __chrony_config.backup_file is defined
    - (_chrony_service ~ '.service') not in ansible_facts.services
      or ansible_facts.services[_chrony_service ~ '.service'].state | default('') != 'running'

- name: "Restart chrony with the restored configuration"
  ansible.builtin.service:
    name: "{{ _chrony_service }}"
    state: restarted
  become: true
  when:
    - __chrony_config.changed
    - __chrony_config.backup_file is defined
    - (_chrony_service ~ '.service') not in ansible_facts.services
      or ansible_facts.services[_chrony_service ~ '.service'].state | default('') != 'running'

- name: "Fail if the configuration was invalid"
  ansible.builtin.fail:
    msg: >-
      {{ _chrony_service }}.service failed to start with the new
      configuration (see 'journalctl -u {{ _chrony_service }}' on the
      target). The previous configuration has been restored{{
      ', from ' + __chrony_config.backup_file if __chrony_config.backup_file is defined
      else ' (no backup was available: chrony_backup_files is false)' }}.
  when:
    - __chrony_config.changed
    - (_chrony_service ~ '.service') not in ansible_facts.services
      or ansible_facts.services[_chrony_service ~ '.service'].state | default('') != 'running'

- name: "Apply systemd hardening"
  ansible.builtin.include_tasks: hardening.yml
  when:
    - ansible_facts.env.container | default('') | length == 0
    - ansible_facts.virtualization_type | default('NA') not in ['docker', 'lxc', 'container', 'podman']
